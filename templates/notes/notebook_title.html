{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div class="d-flex container-fluid justify-content-center  mx-2 px-5 m-3">
    <form method="post" class="form-floating container-fluid" enctype="multipart/form-data"
    style="width:65%;">
        {% csrf_token %}
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        {{ form.media }}
        <div class="fieldWrapper" style="width:100%;">
            {{ form.title.errors }}
            {{ form.title.label_tag }}
            {{ form.title }}
        </div>

        <div class="d-flex container-fluid justify-content-end">
            <button type="submit" class="btn btn-primary col-5  mx-2 px-5 m-3 ">
                {% if editing_mode %}
                Изменить
                {% else %}
                Создать
                {% endif %}
            </button>
            <button type="button" class="btn btn-lg btn-outline-primary mx-2 px-5 m-3 float-bottom"
                    onClick="javascript:history.go(-1);">Отмена
            </button>
        </div>
    </form>
</div>
{% endblock %}
