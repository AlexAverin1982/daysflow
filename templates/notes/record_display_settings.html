{% extends "base.html" %}
{% block title %}
{% if title %}
{{ title }}
{% else %}DaysFlow
{% endif %}
{% endblock %}
{% block content %}

<div class="d-flex container-fluid">
    <form method="post" class="form-floating container-fluid" enctype="multipart/form-data">
        {% csrf_token %}
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        {{ form.media }}
        <div class="row">
            <div class="col-md-3">
                {{ form.field0.errors }}
                {{ form.field0.label_tag }}
            </div>
            <div class="col-md-9 justify-content-end">
                {{ form.field0 }}
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-2">
            </div>
            <div class="col-md-10">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="button" class="btn btn-outline-secondary mx-2 px-5 m-3 float-bottom"
                        onClick="javascript:history.go(-1);">Отмена
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
