{% extends "base.html" %}
{% block title %}{{title}}{% endblock %}
{% block content %}
<div class="container-fluid pb-2 main_content_container" style="height: 90%">
    <div class="d-flex justify-content-center">
        <a href="{% url 'new_record' pk=notebook_id %}"
           class="btn btn-lg btn-outline-success mx-2 px-5 m-3 float-bottom">
            Добавить запись
        </a>
    </div>
    {% if records %}
    <p>
        Сортировать по...
        {% for record in records %}

        <div class="d-flex justify-content-center">
            <a href="{% url 'new_record' pk=notebook_id %}"
               class="btn btn-lg btn-outline-success mx-2 px-5 m-3 float-bottom">
                {{ record.created_at }}
            </a>
        </div>

        {% endfor %}
    </p>
    {% else %}
    <div class="d-flex justify-content-center">
        <h5>Пока записей нет...</h5>
    </div>
    {% endif %}

    <div class="d-flex justify-content-center">
        <a href="{% url 'notebook_details' pk=notebook_id %}"
           class="btn btn-lg btn-outline-success mx-2 px-5 m-3 float-bottom">
            Свойства блокнота
        </a>
    </div>

    <div class="d-flex justify-content-center">
        <button type="button" class="btn btn-lg btn-outline-primary mx-2 px-5 m-3 float-bottom"
                onClick="javascript:history.go(-1);">Назад
        </button>
    </div>
</div>
{% endblock %}
